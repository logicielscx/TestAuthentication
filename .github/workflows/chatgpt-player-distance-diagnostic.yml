name: ChatGPT Player Distance HUD diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'chatgpt-build/player-distance-hud/**'
      - '.github/workflows/chatgpt-player-distance-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt-build/player-distance-hud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle wrapper --gradle-version 9.2.1
      - name: Run build and capture output
        id: build
        continue-on-error: true
        run: ./gradlew build --stacktrace --warning-mode all > build-diagnostic.log 2>&1
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: player-distance-hud-diagnostic
          path: chatgpt-build/player-distance-hud/build-diagnostic.log
          if-no-files-found: error
      - name: Fail after upload when build failed
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 200 build-diagnostic.log
          exit 1
