name: ChatGPT Player Distance HUD build

on:
  push:
    branches:
      - chatgpt-player-distance-hud-build-20260710
    paths:
      - 'chatgpt-build/player-distance-hud/**'
      - '.github/workflows/chatgpt-player-distance-hud.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'chatgpt-build/player-distance-hud/**'
      - '.github/workflows/chatgpt-player-distance-hud.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: chatgpt-build/player-distance-hud

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate checked-in Gradle wrapper
        run: gradle wrapper --gradle-version 9.2.1

      - name: Build and test
        run: ./gradlew build --stacktrace --warning-mode all

      - name: Verify installable JAR
        run: |
          test -f build/libs/playerdistancehud-1.0.0.jar
          unzip -t build/libs/playerdistancehud-1.0.0.jar
          jar tf build/libs/playerdistancehud-1.0.0.jar | tee jar-contents.txt
          grep -q 'fabric.mod.json' jar-contents.txt
          grep -q 'com/example/playerdistancehud/PlayerDistanceHudClient.class' jar-contents.txt

      - name: Install virtual display tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick

      - name: Launch development client and verify window
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -euo pipefail
            ./gradlew runClient --stacktrace > smoke-test.log 2>&1 &
            gradle_pid=$!
            window_id=""
            for attempt in $(seq 1 180); do
              if ! kill -0 "$gradle_pid" 2>/dev/null; then
                wait "$gradle_pid"
                exit 1
              fi
              window_id=$(xdotool search --onlyvisible --name "Minecraft" 2>/dev/null | head -n 1 || true)
              if [ -n "$window_id" ]; then
                sleep 15
                xdotool getwindowname "$window_id" > smoke-window-title.txt
                import -window root smoke-title-screen.png
                kill "$gradle_pid" 2>/dev/null || true
                wait "$gradle_pid" 2>/dev/null || true
                break
              fi
              sleep 1
            done
            if [ -z "$window_id" ]; then
              kill "$gradle_pid" 2>/dev/null || true
              wait "$gradle_pid" 2>/dev/null || true
              echo "Minecraft window was not detected" >&2
              exit 1
            fi
          '
          cat smoke-window-title.txt
          tail -n 250 smoke-test.log
          if grep -E 'Could not execute entrypoint|Crash report|Failed to start Minecraft|java\.lang\.(NoSuchMethodError|NoClassDefFoundError|ClassNotFoundException)' smoke-test.log; then
            exit 1
          fi
          grep -E 'Minecraft|Fabric Loader|Setting user|Backend library|OpenAL|Narrator' smoke-test.log > smoke-markers.txt || true

      - name: Create complete project archive
        run: |
          rm -rf run
          cd ..
          zip -r player-distance-hud-complete.zip player-distance-hud \
            -x 'player-distance-hud/.gradle/*' \
               'player-distance-hud/build/tmp/*' \
               'player-distance-hud/build/devlibs/*' \
               'player-distance-hud/build/classes/*' \
               'player-distance-hud/build/resources/*' \
               'player-distance-hud/build/reports/*' \
               'player-distance-hud/build/test-results/*'

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: player-distance-hud-deliverables
          path: |
            chatgpt-build/player-distance-hud-complete.zip
            chatgpt-build/player-distance-hud/build/libs/playerdistancehud-1.0.0.jar
            chatgpt-build/player-distance-hud/build/libs/playerdistancehud-1.0.0-sources.jar
            chatgpt-build/player-distance-hud/smoke-test.log
            chatgpt-build/player-distance-hud/smoke-window-title.txt
            chatgpt-build/player-distance-hud/smoke-title-screen.png
            chatgpt-build/player-distance-hud/smoke-markers.txt
            chatgpt-build/player-distance-hud/jar-contents.txt
          if-no-files-found: error
